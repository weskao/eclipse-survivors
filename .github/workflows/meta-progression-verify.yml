name: Meta progression verification
on:
  push:
    branches: [feature/meta-progression-game-modes]
  workflow_dispatch:
concurrency:
  group: meta-progression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  screenshots:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install isolated browser for screenshots
        run: |
          # npm crashes on pnpm's node_modules; the parent dir is still on Node's resolve path.
          npm install --prefix .. --no-save --package-lock=false playwright@1.56.1
          ../node_modules/.bin/playwright install --with-deps chromium
      - name: Launch real game and capture desktop/mobile UI
        run: |
          pnpm preview --host 127.0.0.1 --port 4173 > /tmp/meta-preview.log 2>&1 &
          for i in {1..30}; do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node scripts/capture-meta-progression.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meta-progression-real-ui-screenshots
          path: artifacts/meta-progression/
          if-no-files-found: warn
