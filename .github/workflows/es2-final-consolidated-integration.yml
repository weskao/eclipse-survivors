name: ES2 final consolidated gameplay + real browser evidence
on:
  push:
    branches: [feature/es2-final-consolidated-integration]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: es2-consolidated-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify all systems, endurance and Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
        if: success() || failure()
      - run: pnpm build
        if: success() || failure()
      - run: pnpm check-release
        if: success() || failure()
      - name: Profile ten simulated minutes of real Endless engine ticks
        run: ES2_PERF_LONG=1 pnpm exec vitest run tests/es2/performance/benchmark.test.ts
      - name: Install Chromium isolated from project dependencies
        run: |
          npm install --prefix .. --no-save --package-lock=false playwright@1.56.1
          ../node_modules/.bin/playwright install --with-deps chromium
      - name: Capture real browser desktop/mobile Canvas benchmarks and screenshots
        run: |
          pnpm dev --host 127.0.0.1 --port 5173 --strictPort > /tmp/es2-perf-dev.log 2>&1 &
          for i in {1..50}; do curl -sf http://127.0.0.1:5173/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:5173/ >/dev/null
          node scripts/es2-browser-performance.mjs
          PREVIEW_URL=http://127.0.0.1:5173/ node scripts/es2-mobile-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: es2-final-gameplay-browser-evidence
          path: |
            artifacts/es2-browser-performance/
            artifacts/es2-mobile-browser/
          if-no-files-found: warn
