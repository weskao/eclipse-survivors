name: ES2 live wave director host CI
on:
  push:
    branches: [feature/es2-final-wave-director-host]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: es2-wave-host-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
        if: success() || failure()
      - run: pnpm build
        if: success() || failure()
      - run: pnpm check-release
        if: success() || failure()
