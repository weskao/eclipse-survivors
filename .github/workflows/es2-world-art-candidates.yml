name: ES2 world art candidate import and runtime TDD
on:
  push:
    branches: [feature/es2-world-art-candidate-runtime]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run src/assets/es2/production/world-art-candidates.test.ts
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm check-release
