name: ES2 Biomes 8 native 3x verification
on:
  push:
    branches: [feature/es2-art-qa-biomes]
    paths:
      - 'src/assets/es2/production/biomes/**'
      - '.github/workflows/es2-biomes-native3x-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: es2-biomes-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Test native sources and repository regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Native 3x acceptance gate (expected RED until authentic art is committed)
        run: pnpm exec vitest run src/assets/es2/production/biomes/native-3x-candidates.test.ts
      - name: Existing world-art file/manifest integrity
        if: success() || failure()
        run: pnpm exec vitest run src/assets/es2/production/world-art-candidates.test.ts src/game/render/es2/production-world.test.ts
      - name: Full regression suite (release manual-art gate intentionally retained)
        if: success() || failure()
        run: pnpm test
      - name: TypeScript
        if: success() || failure()
        run: pnpm typecheck
      - name: Build production app
        if: success() || failure()
        run: pnpm build
      - name: Release validation
        if: success() || failure()
        run: pnpm check-release
