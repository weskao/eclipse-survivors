name: ES2 real Chromium mobile browser smoke
on:
  push:
    branches: [feature/es2-release-readiness-integration]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: es2-mobile-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install isolated Chromium for real layout QA
        run: |
          npm install --prefix .. --no-save --package-lock=false playwright@1.56.1
          ../node_modules/.bin/playwright install --with-deps chromium
      - name: Launch production preview and test four mobile viewports
        run: |
          pnpm preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/es2-preview.log 2>&1 &
          for i in {1..40}; do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          node scripts/es2-mobile-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: es2-mobile-browser-screenshots
          path: artifacts/es2-mobile-browser/
          if-no-files-found: warn
