name: Knight PixiJS hybrid verification
on:
  push:
    branches: [feature/es2-pixijs-knight-hybrid]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: knight-pixi-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - id: deps
        run: pnpm install --frozen-lockfile
      - name: Install exact experimental PixiJS lockfile
        id: pixi
        run: |
          npm ci --prefix experiments/pixijs-knight
          npm ls --prefix experiments/pixijs-knight pixi.js
          make test-pixi
          make -n dev-pixi dev-pixi-unlocked phone-pixi phone-pixi-unlocked
      - run: pnpm test
      - run: pnpm typecheck
        if: ${{ !cancelled() && steps.pixi.outcome == 'success' }}
      - run: pnpm build
        id: build
        if: ${{ !cancelled() && steps.pixi.outcome == 'success' }}
      - run: pnpm check-release
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      - name: Install isolated Chromium
        id: chromium
        if: ${{ !cancelled() && steps.pixi.outcome == 'success' }}
        run: |
          npm install --prefix .. --no-save --package-lock=false playwright@1.56.1
          ../node_modules/.bin/playwright install --with-deps chromium
      - name: Real game and matched 130-mob renderer evidence
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: |
          pnpm exec vite --host 127.0.0.1 --port 5173 --strictPort > /tmp/knight-pixi.log 2>&1 &
          for i in {1..45}; do curl -sf http://127.0.0.1:5173/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:5173/ >/dev/null
          node scripts/knight-pixi-browser-qa.mjs
      - name: Verify normal production entry without QA flags
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success' }}
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/knight-pixi-preview.log 2>&1 &
          for i in {1..45}; do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          PREVIEW_URL=http://127.0.0.1:4173/ KNIGHT_DEFAULT_ONLY=1 node scripts/knight-pixi-browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knight-pixi-evidence
          path: |
            artifacts/knight-pixi/
            experiments/pixijs-knight/package-lock.json
            /tmp/knight-pixi.log
          if-no-files-found: warn
          retention-days: 7
