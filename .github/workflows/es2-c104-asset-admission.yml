name: ES2 c104 admitted images full TDD verification
on:
  push:
    branches: [feature/es2-c104-asset-admission]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: es2-c104-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow==11.3.0
      - run: python -m unittest discover -s tests/es2/art -p 'test_*.py' -v
      - run: python scripts/es2/inspect_c104.py
      - name: Save immutable c104 source sheets for exact pixel-by-pixel crop review
        uses: actions/upload-artifact@v4
        with:
          name: c104-10-original-source-webps
          path: assets/images/imgs*.webp
          if-no-files-found: error
      - run: python scripts/es2/verify_runtime_atlases.py
      - uses: actions/upload-artifact@v4
        with:
          name: c104-visual-sources-review
          path: art-inspection/
          if-no-files-found: error
      - name: Produce 52 exact-source WebP assets in canonical project directories
        run: python scripts/es2/generate_c104_assets.py --output .
      - name: Upload actual generated 3x artwork for pixel-level acceptance review
        uses: actions/upload-artifact@v4
        with:
          name: c104-52-production-webps-review
          path: |
            src/assets/es2/production/enemies/*.webp
            src/assets/es2/production/bosses/*.webp
            src/assets/es2/production/biomes/*.webp
            src/assets/es2/production/ui/*.webp
            src/assets/es2/production/heroes/*-special@3x.webp
            src/assets/es2/production/c104-provenance.json
          if-no-files-found: error
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run src/game/render/es2/c104-source-art.test.ts
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm check-release
      - name: Commit the tested production image outputs (never on failure)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/es2/production/heroes/*-special@3x.webp
          git add src/assets/es2/production/enemies/ src/assets/es2/production/bosses/
          git add src/assets/es2/production/biomes/ src/assets/es2/production/ui/
          git add src/assets/es2/production/c104-provenance.json
          if ! git diff --cached --quiet; then
            git commit -m "art(es2): install 52 c104 source-cropped 3x production candidates"
            git push origin HEAD:refs/heads/feature/es2-c104-asset-admission
          fi
