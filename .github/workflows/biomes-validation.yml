name: Biomes feature verification
on:
  push:
    branches: [feature/biomes-and-random-events]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  showcase:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile && pnpm build
      - run: python -m pip install --disable-pip-version-check "Pillow==11.1.0" "playwright==1.58.0"
      - run: python -m playwright install --with-deps chromium
      - run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: python scripts/capture-biomes.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eclipse-survivors-biomes-showcase
          path: artifacts/biomes/*.png
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eclipse-survivors-biomes-video
          path: artifacts/biomes/*.mp4
          if-no-files-found: warn
          retention-days: 14
