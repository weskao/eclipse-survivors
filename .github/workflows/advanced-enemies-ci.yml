name: Advanced enemy AI branch verification
on:
  push:
    branches:
      - feature/advanced-enemies-bosses
  workflow_dispatch:

concurrency:
  group: advanced-enemies-branch
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
        if: always()
      - run: pnpm build
        if: always()
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser for gameplay evidence
        run: |
          python -m pip install --disable-pip-version-check playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Capture live boss phases and mobile gameplay
        run: python scripts/capture-enemy-showcase.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: advanced-enemies-gameplay
          path: artifacts/advanced-enemies/
          if-no-files-found: warn
