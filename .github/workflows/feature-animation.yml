name: Feature character animation verification

on:
  push:
    branches: [feature/character-animation-combat-vfx]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build

  visuals:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual-browser capture tools
        run: |
          python -m pip install --disable-pip-version-check "playwright==1.58.0" "Pillow==11.1.0"
          python -m playwright install --with-deps chromium
      - name: Capture all heroes and record gameplay comparison
        run: python scripts/capture-character-animations.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: character-animation-screenshots-video-performance
          path: artifacts/character-animation/
          if-no-files-found: warn
