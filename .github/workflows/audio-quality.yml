name: Check cinematic audio and release version

on:
  push:
    branches:
      - feature/cinematic-audio-menu-version
  pull_request:
    paths:
      - src/**
      - index.html
      - package.json
      - pnpm-lock.yaml
      - tests/**
      - vite.config.ts
      - CHANGELOG.md
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
