name: Check cinematic audio and release version

on:
  push:
    branches:
      - feature/cinematic-audio-menu-version
      - feature/audio-ux-performance-polish
  pull_request:
    paths:
      - src/**
      - index.html
      - package.json
      - pnpm-lock.yaml
      - tests/**
      - vite.config.ts
      - CHANGELOG.md
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  evidence:
    name: Benchmark baseline vs candidate and capture gameplay
    needs: test
    if: github.ref == 'refs/heads/feature/audio-ux-performance-polish'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the pinned main baseline and this branch with identical dependencies
        run: |
          git worktree add --detach "$RUNNER_TEMP/eclipse-baseline" fe6161fa9deea23d4447b39b2085689744f531fe
          (cd "$RUNNER_TEMP/eclipse-baseline" && pnpm install --frozen-lockfile && pnpm build)
          pnpm install --frozen-lockfile
          pnpm build
      - name: Install headless browser tooling
        run: |
          python -m pip install --disable-pip-version-check "playwright==1.58.0"
          python -m playwright install --with-deps chromium
      - name: Measure real canvas callback time and capture original in-game frames
        run: |
          python scripts/benchmark-audio-ux.py \
            --baseline "$RUNNER_TEMP/eclipse-baseline/dist" \
            --candidate dist \
            --out artifacts/audio-ux-performance
          cat artifacts/audio-ux-performance/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-ux-performance-evidence
          path: artifacts/audio-ux-performance/
          if-no-files-found: warn
