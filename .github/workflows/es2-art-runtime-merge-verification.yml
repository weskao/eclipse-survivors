name: ES2 art runtime merge verification
on:
  push:
    branches: [feature/es2-art-runtime-merge-verification]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Full TDD, typecheck, build, release
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
        if: success() || failure()
      - run: pnpm build
        if: success() || failure()
      - run: pnpm check-release
        if: success() || failure()
