name: Verify and publish Survivor Game

# One path: every push to main is checked and published. Tags/Releases come from scripts/release.sh.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy game to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # ubuntu-latest ships Node, so no setup-node step is needed.
      - name: Validate entry point, game logic and offline audio
        run: node scripts/check-release.mjs
      - name: Assemble site
        run: mkdir site && cp index.html site/ && touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify the public game URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL "$PAGE_URL" | grep -q 'id="start"'; then
              echo "Published game verified: $PAGE_URL"; exit 0
            fi
            sleep 10
          done
          echo '::error::The published site did not serve the playable game.'
          exit 1
