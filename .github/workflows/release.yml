name: Verify and publish Eclipse Survivors

# One path: every push to main is checked and published. Tags/Releases come from scripts/release.sh.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Export game artwork and screenshots']
    types: [completed]

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Verify and deploy game to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # pnpm version is read from the packageManager field in package.json.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck and unit tests
        run: |
          pnpm typecheck
          pnpm test
      - name: Build static site
        run: pnpm build
      - name: Validate release metadata and built output
        run: pnpm check-release
      - name: Check branded assets and actual gameplay screenshots
        run: |
          test -s dist/index.html
          test -s dist/manifest.webmanifest
          test -s dist/assets/icon-192.png
          test -s dist/assets/apple-touch-icon.png
          test -s dist/assets/og-cover.png
          test -s dist/assets/screenshots/gameplay.webp
          test -s dist/assets/screenshots/mobile.webp
          test -s dist/assets/screenshots/upgrade.webp
      - name: Disable Jekyll processing
        run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify the public game URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            # Any Vite shell has id="app"; require the game title and a fetchable hashed bundle.
            html=$(curl -fsSL "$PAGE_URL") || html=''
            bundle=$(printf '%s' "$html" | grep -o 'src="\./assets/index-[^"]*\.js"' | head -1 | cut -d'"' -f2)
            if printf '%s' "$html" | grep -q 'ECLIPSE SURVIVORS' && [ -n "$bundle" ] \
              && curl -fsSL "${PAGE_URL%/}/${bundle#./}" | grep -q .; then
              echo "Published game verified: $PAGE_URL"; exit 0
            fi
            sleep 10
          done
          echo '::error::The published site did not serve the playable game.'
          exit 1
