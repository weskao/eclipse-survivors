name: Verify and publish Eclipse Survivors

# Main pushes are verified and deployed; only a successful deployment may publish a versioned Release.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy game to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # pnpm version is read from the packageManager field in package.json.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck and unit tests
        run: |
          pnpm typecheck
          pnpm test
      - name: Build static site
        run: pnpm build
      - name: Validate release metadata and built output
        run: pnpm check-release
      - name: Check branded assets and actual gameplay screenshots
        run: |
          test -s dist/index.html
          test -s dist/manifest.webmanifest
          test -s dist/assets/icon-192.png
          test -s dist/assets/apple-touch-icon.png
          test -s dist/assets/og-cover.png
          test -s dist/assets/screenshots/gameplay.webp
          test -s dist/assets/screenshots/mobile.webp
          test -s dist/assets/screenshots/upgrade.webp
      - name: Disable Jekyll processing
        run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # Artifact indexing can lag behind a successful upload. A clean run must
      # expose exactly one github-pages artifact before deploy-pages starts.
      - name: Wait for Pages artifact indexing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length' || echo 0)
            if [ "$count" = "1" ]; then
              echo "Pages artifact indexed (attempt $attempt)."
              sleep 5
              exit 0
            fi
            if [ "$count" != "0" ]; then
              echo "::error::Expected one Pages artifact, found $count. Use a clean run, not a rerun with duplicates."
              exit 1
            fi
            sleep 5
          done
          echo '::error::Pages artifact is still not discoverable.'
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify the public game URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            # Any Vite shell has id="app"; require the game title and a fetchable hashed bundle.
            html=$(curl -fsSL "$PAGE_URL") || html=''
            bundle=$(printf '%s' "$html" | grep -o 'src="\./assets/index-[^"]*\.js"' | head -1 | cut -d'"' -f2)
            if printf '%s' "$html" | grep -q 'ECLIPSE SURVIVORS' && [ -n "$bundle" ] \
              && curl -fsSL "${PAGE_URL%/}/${bundle#./}" | grep -q .; then
              echo "Published game verified: $PAGE_URL"; exit 0
            fi
            sleep 10
          done
          echo '::error::The published site did not serve the playable game.'
          exit 1

  release:
    name: Publish versioned GitHub Release after deployed v1
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Publish tagged release for exactly the verified main commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current=$(git rev-parse HEAD)
          remote=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$current" != "$GITHUB_SHA" ] || [ "$remote" != "$GITHUB_SHA" ]; then
            echo '::error::main moved while deploying; release the newer commit instead.'
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Existing release $tag; no duplicate."
            exit 0
          fi
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q .; then
            echo "::error::Tag $tag exists without a release. Inspect manually."
            exit 1
          fi
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { found=1; print; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::Missing changelog notes for $tag."
            exit 1
          fi
          gh release create "$tag" --target "$GITHUB_SHA" \
            --title "Eclipse Survivors $tag" --notes-file /tmp/release-notes.md
