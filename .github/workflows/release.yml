name: Verify and publish Eclipse Survivors

# One path: every push to main is checked and published. Tags/Releases come from scripts/release.sh.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Export game artwork and screenshots']
    types: [completed]

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Verify and deploy game to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # ubuntu-latest ships Node, so no setup-node step is needed.
      - name: Validate entry point, game logic and offline audio
        run: node scripts/check-release.mjs
      - name: Check branded assets and actual gameplay screenshots
        run: |
          test -s assets/icon-192.png
          test -s assets/apple-touch-icon.png
          test -s assets/og-cover.png
          test -s assets/screenshots/gameplay.webp
          test -s assets/screenshots/mobile.webp
          test -s assets/screenshots/upgrade.webp
      - name: Assemble site
        run: mkdir site && cp -r index.html manifest.webmanifest assets site/ && touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify the public game URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL "$PAGE_URL" | grep -q 'id="start"'; then
              echo "Published game verified: $PAGE_URL"; exit 0
            fi
            sleep 10
          done
          echo '::error::The published site did not serve the playable game.'
          exit 1
