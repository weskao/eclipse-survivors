name: Verify and publish Survivor Game

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify offline playable HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate entry point, game logic and offline audio
        run: node scripts/check-release.mjs
      - name: Only publish tags reachable from main
        if: startsWith(github.ref, 'refs/tags/v')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  deploy:
    name: Deploy verified game to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site without external build dependencies
        run: |
          mkdir -p site
          cp index.html site/index.html
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify the public game URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --location --fail --silent --show-error \
                --output "$RUNNER_TEMP/published-game.html" "$PAGE_URL" && \
                grep -q '<title>暮境遠征' "$RUNNER_TEMP/published-game.html" && \
                grep -q 'id="start"' "$RUNNER_TEMP/published-game.html"; then
              echo "Published game verified: $PAGE_URL"
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          echo '::error::The published site did not serve the playable game.'
          exit 1

  github-release:
    name: Publish verified GitHub Release for version tags
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release notes after successful deployment
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --verify-tag --title "Eclipse Survivors $TAG" --generate-notes
