name: ES2 Google OAuth and Twilight Embers emulator QA
on:
  push:
    branches: [feature/es2-release-readiness-integration]
    paths: ['src/cloud/**', 'src/components/es2/menu/**', 'src/App.vue', 'src/game/content/meta/**', 'src/game/engine.ts', 'src/i18n.ts', 'firestore.rules', 'firebase.json', 'tests/fixtures/cloud-wallet.*', 'scripts/es2-cloud-emulator-browser.mjs', '.github/workflows/es2-cloud-wallet.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloud-wallet:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - name: Focused cloud regressions and TypeScript
        run: |
          pnpm exec vitest run src/cloud src/components/es2/menu/Es2CloudAccount.test.ts src/game/content/meta/store.test.ts
          pnpm typecheck
      - name: Install isolated real browser
        run: |
          npm install --prefix .. --no-save --package-lock=false playwright@1.56.1
          ../node_modules/.bin/playwright install --with-deps chromium
      - name: Exercise direct Google OAuth against Firebase emulators only
        env:
          VITE_ES2_FIREBASE_EMULATOR: '1'
          VITE_ES2_FIREBASE_CONFIG: '{"apiKey":"demo-api-key","authDomain":"demo-eclipse-survivors.firebaseapp.com","projectId":"demo-eclipse-survivors","appId":"1:123:web:cloudqa"}'
        run: |
          pnpm exec vite --host 127.0.0.1 --port 4175 --strictPort > /tmp/es2-cloud-vite.log 2>&1 &
          for i in {1..40}; do curl -sf http://127.0.0.1:4175/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4175/ >/dev/null
          pnpm dlx firebase-tools@15.34.1 emulators:exec --project demo-eclipse-survivors --only auth,firestore 'node scripts/es2-cloud-emulator-browser.mjs'
