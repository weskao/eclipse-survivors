name: ES2 final audio host TDD verification
on:
  push:
    branches: [feature/es2-final-audio-host-wiring, feature/es3-chest-open-reveal, fix/result-background-music, fix/boss-rush-result-audio]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: es2-final-audio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
        if: success() || failure()
      - run: pnpm build
        if: success() || failure()
      - run: pnpm check-release
        if: success() || failure()
