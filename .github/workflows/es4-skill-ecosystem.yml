name: ES4 skill ecosystem verification
on:
  push:
    branches: [feature/es4-adventurer-hall-skill-ecosystem]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: es4-skill-ecosystem-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify archived ES2 character asset importer (no runtime substitution)
        run: python3 scripts/test_import_es2_hero_candidate.py
      - name: Verify two-hero candidate bundle import and integrity
        run: python3 scripts/test_import_es2_hero_bundle.py
      - name: Verify real staged candidate WebP and PNG bytes
        run: python3 scripts/test_es2_candidate_assets.py
      - name: Verify nine authored hero pose candidates and source QA
        run: node scripts/verify-es2-candidate-pose-art.mjs
      - run: pnpm test
      - run: pnpm typecheck
        if: success() || failure()
      - run: pnpm build
        if: success() || failure()
      - run: pnpm check-release
        if: success() || failure()

  hall-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install isolated browser tools
        run: |
          npm install --prefix .. --no-save --package-lock=false playwright@1.56.1
          ../node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Verify real isolated Hall at representative viewports
        run: |
          VITE_ES2_UNLOCKED=1 pnpm exec vite --host 127.0.0.1 --port 4173 --strictPort > /tmp/es4-hall.log 2>&1 &
          for i in {1..40}; do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          node scripts/es4-hall-browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: es4-hall-browser-evidence
          path: artifacts/es4-hall-browser/
          if-no-files-found: warn
