name: ES2 true Boss-attack gameplay MP4 capture
on:
  push:
    branches: [feature/es2-release-readiness-integration]
    paths:
      - 'scripts/es2-boss-attack-video.mjs'
      - '.github/workflows/es2-boss-attack-video.yml'
      - 'src/game/content/bosses/render.ts'
      - 'src/game/render/pixi-vfx/**'
      - 'src/game/render/es2/boss-motion-reference.ts'
      - 'src/assets/es2/production/bosses/candidates/motion/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  boss-attack-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browser capture runtime
        run: |
          npm install --prefix .. --no-save --package-lock=false playwright@1.56.1
          ../node_modules/.bin/playwright install --with-deps chromium
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
      - name: Record the real game for every Boss phase and attack
        run: |
          pnpm exec vite --host 127.0.0.1 --port 4174 --strictPort > /tmp/es2-boss-video.log 2>&1 &
          for i in {1..40}; do curl -sf http://127.0.0.1:4174/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4174/ >/dev/null
          PREVIEW_URL=http://127.0.0.1:4174/ node scripts/es2-boss-attack-video.mjs
          BOSS_MOTION_QA=1 PREVIEW_URL=http://127.0.0.1:4174/ node scripts/es2-boss-attack-video.mjs
      - name: Preserve real-gameplay MP4, screenshots and attack timestamps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: es2-four-boss-all-attacks-real-gameplay-mp4
          path: artifacts/es2-boss-attack-video/
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve actual body-motion reference MP4 and drawn-cell evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: es2-four-boss-source-motion-real-gameplay-mp4
          path: artifacts/es2-boss-motion-video/
          if-no-files-found: warn
          retention-days: 30
