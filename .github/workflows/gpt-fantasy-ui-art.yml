name: GPT fantasy UI artwork verification
on:
  push:
    branches:
      - feature/gpt-fantasy-ui-art-polish
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check-release

  screenshot-evidence:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile && pnpm build
      - name: Install headless Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.58.0 Pillow==11.1.0
          python -m playwright install --with-deps chromium
      - name: Verify menu selection and upgrade visuals in actual browser
        run: python scripts/capture-fantasy-ui.py
      - name: Upload real game screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-survivors-fantasy-ui-screenshots
          path: artifacts/fantasy-ui/
          retention-days: 14
          if-no-files-found: warn
