name: ES2 forest decoration bleed cleanup (one-off)
on:
  push:
    branches: [feature/es2-art-qa-biomes]
    paths:
      - 'src/assets/es2/production/biomes/.art-decor-cleanup-parts/**'
permissions:
  contents: write
jobs:
  install-cleanup:
    if: "github.event.head_commit.message == 'chore(es2): stage forest sprite alpha-bleed correction'"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify binary patch and eliminate single-cell red bleed
        shell: bash
        run: |
          set -euo pipefail
          cat src/assets/es2/production/biomes/.art-decor-cleanup-parts/part-*.txt > /tmp/es2-forest-alpha.patch
          test "$(wc -c < /tmp/es2-forest-alpha.patch)" -eq 424655
          printf '%s  %s\n' 'e33465ecca55ed18bcb0c6f24261e5e957606339fac2956b6409e3709a565ba6' /tmp/es2-forest-alpha.patch | sha256sum -c -
          git apply --check --binary /tmp/es2-forest-alpha.patch
          git apply --binary /tmp/es2-forest-alpha.patch
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs'
          import {createHash} from 'node:crypto'
          import assert from 'node:assert/strict'
          const root='src/assets/es2/production/biomes/'
          const m=JSON.parse(readFileSync(root+'manifest.json','utf8'))
          const a=m.assets.find(x=>x.id==='cursed-forest:decor')
          assert.ok(a)
          assert.equal(a.status,'needs-human-approval')
          assert.equal(a.native3x,true)
          assert.equal(a.sha256,'a692cdcc010f81ab77c7503bc2657cd38c1a0d71ad8d02bf5e69c8906f27d3e4')
          const data=readFileSync(root+a.path)
          assert.ok(data.length<=a.maxBytes)
          assert.equal(data.toString('ascii',12,16),'VP8X')
          assert.ok(data[20]&16)
          assert.deepEqual([1+data[24]+(data[25]<<8)+(data[26]<<16),1+data[27]+(data[28]<<8)+(data[29]<<16)],[1320,330])
          const h=createHash('sha256').update(data).digest('hex')
          assert.equal(h,'68da345af7cc13cb57eb865b64518f3ad5e56bb129b14bfa5f0c90c9d3d8e1cb')
          a.sha256=h
          a.qaNote=(a.qaNote ?? '')+' Re-authored from the same original master without double re-encoding; removed disconnected red neighboring-frame bleed in frame 2; local zero-red-fragment test and 5px alpha-gutter checks passed; human review still pending.'
          assert.ok(m.assets.every(x=>x.native3x && x.status==='needs-human-approval'))
          writeFileSync(root+'manifest.json',JSON.stringify(m,null,2)+'\n')
          NODE
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run src/assets/es2/production/biomes/native-3x-candidates.test.ts src/assets/es2/production/world-art-candidates.test.ts src/game/render/es2/production-world.test.ts
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm check-release
      - name: Full suite report (other art acceptance may remain blocked)
        continue-on-error: true
        run: pnpm test
      - name: Fast-forward the cleaned sprite only, delete this one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = 'refs/heads/feature/es2-art-qa-biomes'
          git rm -r src/assets/es2/production/biomes/.art-decor-cleanup-parts
          git rm .github/workflows/es2-forest-decor-alpha-cleanup.yml
          git add src/assets/es2/production/biomes/cursed-forest-decor@3x.webp src/assets/es2/production/biomes/manifest.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(es2): remove forest decoration neighboring-frame alpha contamination'
          git fetch origin feature/es2-art-qa-biomes
          test "$(git rev-parse origin/feature/es2-art-qa-biomes)" = "${GITHUB_SHA}"
          git push origin HEAD:feature/es2-art-qa-biomes
