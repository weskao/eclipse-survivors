name: Export game artwork and screenshots

on:
  push:
    branches: [main]
    paths:
      - assets/app-icon.svg
      - assets/og-cover.svg
      - manifest.webmanifest
      - scripts/export-brand-assets.py
      - .github/workflows/brand-assets.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: survivor-brand-assets
  cancel-in-progress: false

jobs:
  artwork:
    name: Render PNG art and capture gameplay screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tooling (build only; not used by the game)
        run: |
          python -m pip install --disable-pip-version-check "cairosvg==2.7.1" "Pillow==11.1.0" "playwright==1.58.0"
          python -m playwright install --with-deps chromium
      - name: Render actual marketing and home-screen assets
        run: python scripts/export-brand-assets.py
      - name: Commit generated image files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/apple-touch-icon.png assets/icon-192.png assets/icon-512.png assets/og-cover.png assets/screenshots/gameplay.webp assets/screenshots/mobile.webp
          if git diff --cached --quiet; then
            echo "Image assets already up to date."
            exit 0
          fi
          git commit -m "art: render app icons, social preview and in-game screenshots"
          git push origin HEAD:main
