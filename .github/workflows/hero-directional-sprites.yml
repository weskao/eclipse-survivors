name: Directional hero sprites verification
on:
  push:
    branches: [feature/hero-directional-sprite-sheets]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm check-release

  visual-evidence:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --disable-pip-version-check "playwright==1.58.0" "Pillow==11.1.0"
          python -m playwright install --with-deps chromium
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: python scripts/capture-character-animations.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: directional-hero-animation-videos-and-images
          path: artifacts/character-animation/
          if-no-files-found: warn
