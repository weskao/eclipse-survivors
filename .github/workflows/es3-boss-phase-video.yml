name: Boss phase II and III real gameplay with audio
on:
  push:
    branches: [feature/es3-chest-open-reveal]
    paths:
      - '.github/workflows/es3-boss-phase-video.yml'
      - 'scripts/es3-boss-phase-video.mjs'
      - 'src/game/engine.ts'
      - 'src/game/render/**'
      - 'src/game/audio/**'
      - 'src/components/es2/hud/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        boss: [abyss-monarch, frost-sovereign, infernal-titan, eclipse-seraph]
    env:
      BOSS_ID: ${{ matrix.boss }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install real recording dependencies
        run: |
          npm install --prefix .. --no-save --package-lock=false playwright@1.56.1
          ../node_modules/.bin/playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg xvfb pulseaudio pulseaudio-utils
      - name: Capture game and live audio
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=bossqa sink_properties=device.description=BossQA
          pactl set-default-sink bossqa
          export PULSE_SINK=bossqa
          pnpm exec vite --host 127.0.0.1 --port 4174 --strictPort > /tmp/boss-phase-video.log 2>&1 &
          for i in {1..60}; do curl -sf http://127.0.0.1:4174/@vite/client >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4174/@vite/client >/dev/null
          xvfb-run -a -s "-screen 0 1280x720x24" node scripts/es3-boss-phase-video.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-boss-phase-${{ matrix.boss }}-mp4
          path: artifacts/boss-phase-video/
          if-no-files-found: warn
          retention-days: 30
