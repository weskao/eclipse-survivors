name: ES2 real browser and long-run performance evidence
on:
  push:
    branches: [feature/es2-final-performance-browser]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: es2-perf-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm check-release
      - name: Ten simulated minutes, real engine steps, observed memory samples
        run: ES2_PERF_LONG=1 pnpm exec vitest run tests/es2/performance/benchmark.test.ts
      - name: Install isolated Chromium (no new app dependency)
        run: |
          npm install --prefix .. --no-save --package-lock=false playwright@1.56.1
          ../node_modules/.bin/playwright install --with-deps chromium
      - name: Run real browser Canvas stress profiling
        run: |
          pnpm dev --host 127.0.0.1 --port 5173 --strictPort > /tmp/es2-perf-preview.log 2>&1 &
          for i in {1..45}; do curl -sf http://127.0.0.1:5173/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:5173/ >/dev/null
          node scripts/es2-browser-performance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: es2-real-browser-performance-evidence
          path: artifacts/es2-browser-performance/
          if-no-files-found: warn
