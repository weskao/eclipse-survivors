name: ES2 safe general PNG to WebP migration
on:
  push:
    branches: [feature/es2-release-readiness-integration]
    paths: ['.github/workflows/es2-safe-webp-migration.yml']
permissions:
  contents: read
jobs:
  migrate:
    if: github.repository == 'weskao/eclipse-survivors' && github.ref == 'refs/heads/feature/es2-release-readiness-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/es2-release-readiness-integration
      - name: Record actual checked-out branch revision
        run: echo "MIGRATION_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check Pillow==12.3.0
      - name: Verify conversion and preservation guards
        run: python scripts/test_convert_unreferenced_pngs.py -v
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: RED - verify existing C104 runtime still imports PNG
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/game/render/es2/c104-source-art.test.ts')
          s = p.read_text()
          old = r'/\.png(?:\?|$)/'
          assert s.count(old) == 1
          p.write_text(s.replace(old, r'/\.webp(?:\?|$)/'))
          PY
          if pnpm exec vitest run src/game/render/es2/c104-source-art.test.ts > /tmp/c104-red.log 2>&1; then
            cat /tmp/c104-red.log
            exit 1
          fi
          cat /tmp/c104-red.log
          grep -q 'references all ten immutable authored PNGs' /tmp/c104-red.log
          grep -q 'AssertionError' /tmp/c104-red.log
          git restore -- src/game/render/es2/c104-source-art.test.ts
      - name: Create verified C104 WebP display derivatives; retain immutable masters
        run: |
          set -euo pipefail
          python scripts/convert_unreferenced_pngs.py --c104-display | tee /tmp/es2-webp-migration.json
          git add -- assets/images/*.webp src/game/render/es2/c104-source-art.ts src/game/render/es2/c104-source-art.test.ts
          git diff --cached --stat
          test -z "$(git diff HEAD --name-only -- 'assets/images/*.png')"
      - name: GREEN - verify WebP runtime imports
        run: pnpm exec vitest run src/game/render/es2/c104-source-art.test.ts
      - run: pnpm build
      - run: pnpm check-release
      - name: Commit only verified asset conversions if branch has not advanced
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then echo 'No safe asset changes'; exit 0; fi
          git diff --cached --name-only | grep -vE '^(assets/images/imgs([1-9]|10)\.webp|src/game/render/es2/c104-source-art(\.test)?\.ts)$' > /tmp/unexpected || true
          test ! -s /tmp/unexpected
          git diff --exit-code
          if test "$(git ls-remote origin refs/heads/feature/es2-release-readiness-integration | cut -f1)" != "$MIGRATION_BASE"; then
            echo "::error::Concurrent branch update; converted files were NOT committed. Retry from current HEAD."
            exit 1
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Use verified C104 WebP display art while retaining immutable PNG masters'
          git push origin HEAD:refs/heads/feature/es2-release-readiness-integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safe-webp-migration-report
          path: /tmp/es2-webp-migration.json
          if-no-files-found: warn
